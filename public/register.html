<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register // Slippers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/site.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body style="justify-content:center;">

<div class="authframe">
  <h1>Slippers</h1>
  <div class="subtitle">create an account to start chatting</div>

  <div class="errorMsg" id="errorMsg"></div>

  <form id="registerForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
    </div>

    <!-- honeypot: real users never see or fill this in -->
    <div class="hp-field" aria-hidden="true">
      <label for="website">Leave this field empty</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="field ageConfirmRow">
      <label class="ageCheckLabel">
        <input type="checkbox" id="ageConfirm" required>
        I confirm I am 18 or older.
      </label>
    </div>

    <div class="turnstile-wrap">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADvrM0-AMU69l6oS"></div>
    </div>

    <button type="submit" class="authBtn" id="submitBtn">Create account</button>
  </form>

  <div class="authswitch">Already have an account? <a href="/login.html">Log in</a></div>
  <div class="authswitch" style="margin-top:6px; font-size:11.5px;">
    By creating an account you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.
  </div>
</div>

<footer class="siteFooter">
  <div class="footerName">&copy; 2026 <a href="https://github.com/RolinaVorster0101" target="_blank" rel="noopener">Rolina Vorster</a></div>
  <div>Privately Owned · Roodepoort, Gauteng, South Africa</div>
  <div><a href="mailto:mail@rvor.co.za">mail@rvor.co.za</a> · +27 79 982 9904</div>
  <div><a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms &amp; Conditions</a></div>
</footer>

<script src="/js/register.js"></script>
<script src="/js/cookieConsent.js"></script>
</body>
</html>
