<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin // Slippers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="adminBody">

<div class="adminTopbar">
  <h1>Slippers <span class="adminTag">admin</span></h1>
  <div class="adminTopbarRight">
    <button id="exportBtn" class="topLink" style="background:none;border:none;cursor:pointer;font:inherit;">Export rules</button>
    <label class="topLink" style="cursor:pointer;">
      Import rules
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </label>
    <span id="whoText"></span>
    <a href="/" class="topLink">back to chat</a>
    <a href="#" id="logoutLink" class="topLink">log out</a>
  </div>
</div>

<div class="adminLayout">
  <aside class="sidebar">
    <div class="sidebarHeader">Topics</div>
    <ul id="topicList"></ul>
    <li class="topicItem generalItem" id="generalTopicBtn" data-topic-id="">General (no topic)</li>
    <button class="addTopicBtn" id="addTopicBtn">+ New Topic</button>
  </aside>

  <main class="rulesPane">
    <div class="rulesPaneHeader">
      <h2 id="selectedTopicTitle">General (no topic)</h2>
      <button class="addRuleBtn" id="addRuleBtn">+ New Rule</button>
    </div>
    <div id="rulesList"></div>
  </main>
</div>

<template id="ruleCardTemplate">
  <div class="ruleCard">
    <div class="specialBadge" style="display:none;"></div>
    <div class="ruleCardRow">
      <label>Patterns <span class="hint">(one per line, use * as a wildcard word-group)</span></label>
      <textarea class="rc-patterns" rows="3"></textarea>
    </div>
    <div class="ruleCardRow">
      <label>Replies <span class="hint">(one per line — a random one is picked each time; use {0} for a captured star, {botName} for her name, {name} for the user's stored name, {mood} for her mood word, {reflect0} for a pronoun-swapped star)</span></label>
      <textarea class="rc-replies" rows="3"></textarea>
    </div>
    <div class="ruleCardRow rc-altWrap" style="display:none;">
      <label>Alternate replies <span class="hint">(used when the name isn't known yet)</span></label>
      <textarea class="rc-repliesAlt" rows="2"></textarea>
    </div>
    <div class="ruleCardGrid">
      <div>
        <label>Requires topic</label>
        <select class="rc-requiresTopic"></select>
      </div>
      <div>
        <label>Sets topic</label>
        <select class="rc-setsTopic"></select>
      </div>
      <div>
        <label>Sort order</label>
        <input type="number" class="rc-sortOrder" value="0">
      </div>
    </div>
    <div class="ruleCardRow ruleCardCheckboxes">
      <label class="checkboxLabel"><input type="checkbox" class="rc-clearsTopic"> Clears topic on match</label>
      <label class="checkboxLabel"><input type="checkbox" class="rc-enabled" checked> Enabled</label>
    </div>
    <div class="ruleCardRow">
      <label>Notes <span class="hint">(admin-facing label, optional)</span></label>
      <input type="text" class="rc-notes">
    </div>
    <div class="ruleCardActions">
      <button class="saveRuleBtn">Save</button>
      <button class="deleteRuleBtn">Delete</button>
      <span class="saveStatus"></span>
    </div>
  </div>
</template>

<script src="/js/admin.js"></script>
<script src="/js/cookieConsent.js"></script>
</body>
</html>
